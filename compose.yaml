services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: streetraceing
      POSTGRES_USER: streetraceing
      POSTGRES_PASSWORD: streetraceing
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streetraceing -d streetraceing']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
